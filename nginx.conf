load_module modules/ngx_http_acme_module.so;

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;
# every reload starts new workers; old ones finish their requests, but websockets and long polls
# could keep them alive for an hour each. Cap it so frequent reloads can't pile up memory.
worker_shutdown_timeout 5m;

events {
    worker_connections  8192;  # stock 1024 caps a proxy at ~500 clients/worker (each uses 2 fds)
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    # one write() per request to the docker log pipe costs ~40% rps on small files; batch instead.
    # 4k = PIPE_BUF, so writes stay atomic and workers can't interleave half-lines.
    access_log  /var/log/nginx/access.log  main  buffer=4k flush=1s;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;
}
