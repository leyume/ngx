# End-to-end: real ACME issuance (http-01 native + dns-01 wildcard) against Pebble, plus the local CA,
# static/SPA, PHP, path routes, upstream TLS verification and live reload. Run: sh test/run.sh
services:
  challtestsrv:  # mock DNS: every A lookup -> web, TXT records set via HTTP API
    image: ghcr.io/letsencrypt/pebble-challtestsrv:latest
    command: -defaultIPv6 "" -defaultIPv4 10.30.0.10
    networks: { default: { ipv4_address: 10.30.0.3 } }
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest
    command: -config /cfg/pebble.json -dnsserver 10.30.0.3:8053
    environment: { PEBBLE_VA_NOSLEEP: "1", PEBBLE_WFE_NONCEREJECT: "0" }
    volumes: [./pebble.json:/cfg/pebble.json:ro]
  app:
    image: traefik/whoami
  app2:
    image: traefik/whoami
  php:
    image: php:8.4-fpm-alpine
    volumes: [./run/php:/srv/php:ro]  # same path as in web: fpm opens the SCRIPT_FILENAME nginx sends
  web:
    build: ..
    depends_on: [pebble, challtestsrv]
    environment:
      SITES: >-
        site.example=app:80 files.example=/usr/share/nginx/html wild.example,*.wild.example=app:80
        local.test=app:80 spa.test=/srv/www php.test=fastcgi://php:9000/srv/php
        paths.test=app:80 paths.test/exact=app2:80 paths.test/pre/*=http://app2:80/v1/
        verify.test=https://pebble:14000 insecure.test=https+insecure://pebble:14000
      ACME_URL: https://pebble:14000/dir
      ACME_CA: /pebble.minica.pem
      ACME_EMAIL: admin@site.example
      DNS_PROVIDER: dns_challtest
      DNS_SLEEP: "1"
    volumes:
      - ./pebble.minica.pem:/pebble.minica.pem:ro
      - ./dns_challtest.sh:/opt/acme.sh/dnsapi/dns_challtest.sh:ro
      - ./run/www:/srv/www:ro
      - ./run/php:/srv/php:ro
      - ./run/ngx:/etc/ngx
    networks: { default: { ipv4_address: 10.30.0.10 } }
networks:
  default:
    ipam: { config: [{ subnet: 10.30.0.0/24, ip_range: 10.30.0.128/25 }] }  # dynamic IPs from .128+, so static .3/.10 never collide
